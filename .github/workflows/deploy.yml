name: Deploy Wellman (Vite) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wellman-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and compile Vite
        run: npm run build
      - name: Validate built site
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/wellman/assets/' dist/index.html
          if grep -q '/src/main.ts' dist/index.html; then echo 'Error: unpublished TypeScript entrypoint'; exit 1; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled site
        id: deployment
        uses: actions/deploy-pages@v4
