name: Build and publish Wellman (Vite)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wellman-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore Vite source index
        run: cp index.source.html index.html
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Check built files
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/wellman/assets/' dist/index.html
          if grep -q '/src/main.ts' dist/index.html; then exit 1; fi
      - name: Publish built files to main for branch-based Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html index.html
          mkdir -p assets
          cp -a dist/assets/. assets/
          mkdir -p models
          cp -a dist/models/. models/
          for file in favicon.svg icons.svg; do
            if test -f "dist/$file"; then cp "dist/$file" "$file"; fi
          done
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets models .nojekyll favicon.svg icons.svg
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish compiled Wellman site'
            git push origin HEAD:main
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo 'Pages branch build is unavailable; using artifact deployment.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Actions artifact
        id: deployment
        uses: actions/deploy-pages@v4
